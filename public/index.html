<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141A33">
<title>District Survival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<!-- Firebase compat SDK: classic scripts, no bundler or ES-module step needed -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
/* ---------- tokens ---------- */
:root{
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#141A33; --ink2:#4A5170; --paper:#EDF0EA; --card:#FFFFFF; --line:#D3D9DF; --soft:#E6EAEE;
  --council:#C41E56; --council-ink:#FFFFFF; --signal:#FFC928; --signal-ink:#1D1600; --safe:#1B8A5A; --warn:#C2410C; --sky:#2867D8;
  --map-field:#E3EBDD; --map-ring:#B3C1AD; --map-hub:#F4D25E; --stage:#0D1024;
  --r:20px; --shadow:0 2px 0 rgba(20,26,51,.07),0 10px 24px rgba(20,26,51,.08);
  --disp:'Big Shoulders Display','Arial Narrow','Haettenschweiler',Impact,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#EEF0FA; --ink2:#A9B0CE; --paper:#0E1226; --card:#181E3C; --line:#2C3466; --soft:#222951;
    --council:#FF6491; --council-ink:#2A0616; --safe:#3DD598; --warn:#FF9A62; --sky:#7DA6FF;
    --map-field:#1B2247; --map-ring:#3A4485; --map-hub:#8A6E12; --shadow:0 2px 0 rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#EEF0FA; --ink2:#A9B0CE; --paper:#0E1226; --card:#181E3C; --line:#2C3466; --soft:#222951;
  --council:#FF6491; --council-ink:#2A0616; --safe:#3DD598; --warn:#FF9A62; --sky:#7DA6FF;
  --map-field:#1B2247; --map-ring:#3A4485; --map-hub:#8A6E12; --shadow:0 2px 0 rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{max-width:540px;margin:0 auto}
.boot{padding:40vh 24px;text-align:center;font-family:var(--disp);font-size:2rem;font-weight:800;letter-spacing:.04em}
.boot-wait,.boot-err{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.boot-err{padding:14px 16px;gap:12px;justify-content:flex-start;padding-top:20vh}
.connpill{display:block;width:100%;text-align:center;padding:6px 10px;font-weight:700;font-size:.85rem}
.connpill.reconnecting{background:var(--signal);color:var(--signal-ink)}
.connpill.offline{background:var(--warn);color:#fff}

/* ---------- layout ---------- */
.page{display:flex;flex-direction:column;gap:14px;padding:14px 16px 44px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:flex;flex-wrap:wrap;gap:8px}
.gap{height:8px}.center{text-align:center}
.muted{color:var(--ink2)}
.fine{font-size:.9rem;color:var(--ink2)}
.big{font-size:1.15rem;font-weight:700}
.err{color:var(--warn);font-weight:700}
.kick{font-size:.95rem;font-weight:700;color:var(--ink2);margin-bottom:4px}
.q{font-family:var(--disp);font-weight:800;font-size:1.55rem;line-height:1.05;letter-spacing:.01em;margin-bottom:8px}
.lbl{font-weight:700;font-size:.9rem;margin:10px 0 6px;color:var(--ink2)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:8px 0;background:var(--paper)}
.top h2{flex:1;font-family:var(--disp);font-weight:800;font-size:1.7rem;letter-spacing:.01em;line-height:1}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0}
.hearts{font-size:1.35rem;letter-spacing:1px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card h2{font-family:var(--disp);font-weight:900;font-size:1.9rem;line-height:1}
.hero{padding:20px}
.hero-h{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:clamp(2.6rem,13vw,3.9rem);line-height:.9;letter-spacing:.005em}
.hero-h.sm{font-size:clamp(2rem,9vw,2.7rem)}
.card.alert,.card.now.alert{background:color-mix(in srgb,var(--council) 11%,var(--card));border-color:color-mix(in srgb,var(--council) 45%,var(--line))}
.card.ok{background:color-mix(in srgb,var(--safe) 12%,var(--card));border-color:color-mix(in srgb,var(--safe) 45%,var(--line))}
.card.dark,.hero.dark{background:var(--stage);color:#fff;border-color:#000}
.card.alertc{border:2px solid var(--council)}
.safety{position:relative;overflow:hidden;padding-top:26px}
.hazard-bar{position:absolute;top:0;left:0;right:0;height:10px;background:repeating-linear-gradient(-45deg,var(--signal) 0 12px,var(--ink) 12px 24px)}
.rules{margin:0;padding-left:1.2rem;display:grid;gap:2px}
.mapcard{align-items:stretch}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.kv>span:first-child{color:var(--ink2);font-weight:700}
.kv b{text-align:right}

/* ---------- landing ---------- */
.landing{padding-top:28px}
.brand{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.brand h1{font-family:var(--disp);font-weight:900;font-size:clamp(3.4rem,17vw,5.2rem);line-height:.86;letter-spacing:.005em}
.stamp{font-family:var(--disp);font-weight:900;font-size:1.6rem;background:var(--signal);color:var(--signal-ink);padding:2px 12px;border-radius:10px;transform:rotate(-4deg);border:3px solid var(--ink)}
.lead{font-size:1.15rem;color:var(--ink2);max-width:30ch}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:58px;padding:12px 18px;border-radius:16px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700;font-size:1.1rem;line-height:1.15;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn.huge{min-height:72px;font-size:1.28rem;border-radius:20px}
.btn.sm{min-height:44px;padding:8px 14px;font-size:.98rem;border-radius:12px}
.btn.primary{background:var(--council);color:var(--council-ink);border-color:var(--council);box-shadow:0 4px 0 color-mix(in srgb,var(--council) 55%,#000)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 color-mix(in srgb,var(--council) 55%,#000)}
.btn.signal{background:var(--signal);color:var(--signal-ink);border-color:var(--signal);box-shadow:0 4px 0 #b88900}
.btn.alt{background:transparent}
.btn.ghost{background:transparent;border-color:transparent;text-decoration:underline;text-underline-offset:3px;min-height:48px}
.btn.danger{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn.pill,.pill{min-height:38px;padding:4px 14px;border-radius:99px;font-size:.95rem;background:var(--ink);color:var(--paper);border:0;font-weight:700}
.filebtn{cursor:pointer}
.x-b{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:transparent;font-weight:800}
.sq{width:56px;height:56px;border-radius:16px;border:2px solid var(--ink);background:var(--card);font-size:1.8rem;font-weight:800;line-height:1}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.field label{font-weight:700}
.in{width:100%;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:1.1rem;padding:10px 14px;font-family:inherit}
textarea.in{min-height:96px;resize:vertical}
.in.code{font-family:var(--disp);font-weight:900;font-size:3rem;text-align:center;letter-spacing:.3em;text-transform:uppercase;min-height:84px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper output{font-family:var(--disp);font-weight:900;font-size:2.6rem;min-width:3ch;text-align:center}
.stepper.sm{gap:8px}.stepper.sm .sq{width:44px;height:44px;font-size:1.4rem;border-radius:12px}.stepper.sm output{font-size:1.5rem;min-width:2.6ch}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-height:54px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1rem}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg.big button{min-height:64px;font-size:1.15rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;background:var(--soft);font-weight:700;font-size:.9rem;border:2px solid transparent}
.chip.sm{font-size:.75rem;padding:1px 8px}
.chip.pick{min-height:46px;padding:6px 14px;font-size:1rem;background:var(--card);border-color:var(--line)}
.chip.on{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.chip.warn{background:color-mix(in srgb,var(--warn) 20%,var(--card));border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.chip.ok{background:color-mix(in srgb,var(--safe) 20%,var(--card));border-color:color-mix(in srgb,var(--safe) 50%,transparent)}
.chip.ev{background:color-mix(in srgb,var(--sky) 20%,var(--card));border-color:color-mix(in srgb,var(--sky) 50%,transparent)}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.av-b{min-height:52px;font-size:1.7rem;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.av-b.on{border-color:var(--council);background:color-mix(in srgb,var(--council) 14%,var(--card))}
.av{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--soft);font-size:1.4rem}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.plist .pn{flex:1;min-width:0}.plist .pn small{color:var(--ink2)}
.code-big{font-family:var(--disp);font-weight:900;font-size:5rem;letter-spacing:.2em;line-height:1;text-align:center;padding-left:.2em}
.codecard{align-items:center;text-align:center;background:var(--stage);color:#fff;border-color:#000}
.codecard .kick,.codecard .fine{color:#B9C0E4}

/* ---------- district tag (ticket) ---------- */
.tag{display:inline-flex;align-items:stretch;max-width:100%;background:hsl(var(--h) 58% 33%);color:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tag-n{font-family:var(--disp);font-weight:900;font-size:2.2rem;line-height:1;padding:6px 12px 4px;background:rgba(0,0,0,.24);display:flex;align-items:center;border-right:2px dashed rgba(255,255,255,.45)}
.tag-t{padding:6px 12px;font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:6px;min-width:0}
.tag-t i{font-style:normal}
.tag.sm .tag-n{font-size:1.45rem;padding:3px 9px 2px}.tag.sm .tag-t{font-size:.82rem;padding:4px 9px}
.tagwrap{display:flex;justify-content:center;padding:10px 0}
.pick-list{display:grid;gap:8px;max-height:50vh;overflow:auto}
.pick{display:flex;gap:10px;align-items:center;min-height:56px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1rem;text-align:left}
.pick b{font-family:var(--disp);font-weight:900;font-size:1.6rem;color:hsl(var(--h) 60% 40%)}

/* ---------- home ---------- */
.now h1{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:clamp(2.1rem,10vw,2.9rem);line-height:.92}
.nowtext{font-size:1.12rem}
.cd{font-family:var(--disp);font-weight:800;font-variant-numeric:tabular-nums}
.big.cd{font-size:2.2rem}
.grid6{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:96px;padding:12px 14px;border-radius:18px;border:2px solid var(--ink);background:var(--card);text-align:left;font-size:1.15rem;box-shadow:0 4px 0 var(--ink)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tile .ti{font-size:2rem;line-height:1}
.tile b{font-family:var(--disp);font-weight:800;font-size:1.55rem;text-transform:uppercase;letter-spacing:.02em}
.tile.accent{background:var(--signal);color:var(--signal-ink);border-color:var(--ink)}
.bdg{position:absolute;top:8px;right:8px;background:var(--council);color:#fff;font-style:normal;font-weight:800;font-size:.8rem;padding:1px 8px;border-radius:99px}
.tabs .bdg{position:static;margin-left:4px}
.supbox{display:flex;flex-wrap:wrap;gap:6px}
.sup{display:inline-flex;align-items:center;gap:2px;padding:3px 9px;border-radius:12px;background:var(--soft);font-size:1.1rem}
.sup b{font-size:.85rem}
.buffrow{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.bi{font-size:2rem;line-height:1}
.feed .fe,.fe{font-size:.95rem;padding:6px 0;border-bottom:1px solid var(--line)}
.nearby{text-align:center;font-weight:700}
.safe-note{padding:8px 12px;border-left:5px solid var(--signal);background:color-mix(in srgb,var(--signal) 16%,var(--card));border-radius:8px}
.safe-foot{padding-top:6px}
.lore{font-size:1.05rem}.motto{font-family:var(--disp);font-weight:800;font-size:1.5rem;color:var(--council)}

/* ---------- map ---------- */
.map{width:100%;max-width:380px;display:block;margin:0 auto;overflow:visible}
.m-field{fill:var(--map-field)}.m-ring{fill:none;stroke:var(--map-ring);stroke-width:1.5}.m-hub{fill:var(--map-hub);fill-opacity:.55}
.m-spoke{stroke:var(--map-ring);stroke-width:1;stroke-dasharray:3 4}
.m-glow{fill:var(--signal);opacity:.6;animation:pulse 1.3s ease-in-out infinite}
.m-target{fill:var(--council);fill-opacity:.24;stroke:var(--council);stroke-width:2;stroke-dasharray:5 3}
.m-drop{fill:var(--signal);fill-opacity:.35}
.m-dir{font:700 12px var(--body);fill:var(--ink2)}.m-hubt{font:800 10px var(--disp);letter-spacing:.12em;fill:var(--ink)}
.m-emoji{font-size:17px}.m-ev{font-size:22px}
.m-fuzz{fill:var(--ink);opacity:.16}.m-q{font:800 15px var(--disp);fill:var(--ink)}
.m-dot{fill:hsl(var(--h) 58% 36%);stroke:#fff;stroke-width:2}.m-dot.tracked{stroke-dasharray:3 2}.m-dot.ally{stroke:var(--signal);stroke-width:3}
.m-num{font:900 13px var(--disp);fill:#fff}
.m-me-halo{fill:var(--council);opacity:.28;animation:pulse 1.6s ease-in-out infinite}.m-me{fill:var(--council);stroke:#fff;stroke-width:2}

/* ---------- ceremony / stage ---------- */
.stage{min-height:100vh;background:var(--stage);color:#fff;padding:24px 20px 40px;display:flex;flex-direction:column;gap:16px;max-width:540px;margin:0 auto}
.stage .card{color:var(--ink)}
.cer{justify-content:center;cursor:pointer}
.cer-lines{display:flex;flex-direction:column;gap:6px;min-height:60vh;justify-content:center}
.cer-l{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:clamp(2.4rem,11vw,3.6rem);line-height:.98;opacity:.5}
.cer-l.cur{opacity:1;animation:rise .6s both}.cer-l.fin{color:var(--signal)}
.tapnote{color:#8B93BC}
.rev{justify-content:space-between;background:hsl(var(--h) 55% 15%)}
.rev-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;animation:rise .5s both}
.rev-body .kick{color:#B9C0E4}
.rev-nav{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:#ffffff40}.dots i.on{background:var(--signal)}
.stampnum{font-family:var(--disp);font-weight:900;font-size:min(42vw,11rem);line-height:.9;color:var(--signal);border:8px solid var(--signal);border-radius:24px;padding:0 26px;display:inline-block;align-self:flex-start;transform:rotate(-4deg)}
.stampnum.anim{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
.cer-h{font-family:var(--disp);font-weight:900;font-size:2.6rem;text-transform:uppercase;line-height:.95}
.partner{display:flex;align-items:center;gap:12px;font-size:1.6rem}.partner .av{width:56px;height:56px;font-size:2.2rem}.partner i{color:#B9C0E4}
.rev .lore{color:#E8EBFA;font-size:1.25rem}.rev .motto{color:var(--signal)}
.buffbig{font-size:5rem;line-height:1}
.stage-lite .hero{background:var(--stage);color:#fff;border-color:#000}
.stage-lite .kick{color:#B9C0E4}
.crate{display:grid;gap:10px}
.loot{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:#ffffff14}
.loot span{grid-row:span 2;font-size:2.3rem}.loot b{font-size:1.1rem}.loot small{color:#B9C0E4}
.loot.anim{animation:pop .5s both}
.hero .lore,.hero.dark .lore{color:inherit}

/* ---------- mission ---------- */
.steps{display:flex;flex-wrap:wrap;gap:6px}
.prog{display:flex;gap:8px;justify-content:center}
.pd{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:var(--soft);border:2px solid transparent}
.pd.cur{border-color:var(--council);background:color-mix(in srgb,var(--council) 14%,var(--card))}.pd.ok{background:color-mix(in srgb,var(--safe) 28%,var(--card))}.pd.bad{background:color-mix(in srgb,var(--warn) 28%,var(--card));opacity:.7}
.decree{font-size:1.25rem;font-weight:700}
.dest{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:var(--soft)}
.dest span{font-size:.9rem;color:var(--ink2);font-weight:700}.dest b{font-family:var(--disp);font-weight:900;font-size:1.9rem;text-transform:uppercase;line-height:1}
.timer{font-family:var(--disp);font-weight:900;font-size:1.8rem;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--council);border-radius:99px}
.question{font-family:var(--body);font-size:1.4rem;font-weight:700;line-height:1.25}
.opts{display:grid;gap:10px}.opts.grid4{grid-template-columns:1fr 1fr}
.opt{min-height:64px;text-align:left;font-size:1.12rem;font-weight:700;border:2px solid var(--ink);border-radius:16px;background:var(--card);padding:12px 16px;box-shadow:0 3px 0 var(--ink)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt.em{text-align:center;font-size:2.6rem;min-height:84px}
.opt.right{background:color-mix(in srgb,var(--safe) 30%,var(--card));border-color:var(--safe);opacity:1}
.opt.wrong{background:color-mix(in srgb,var(--warn) 30%,var(--card));border-color:var(--warn);opacity:1}
.verdict{font-size:1.3rem;font-weight:800}.verdict.good{color:var(--safe)}.verdict.bad{color:var(--warn)}
.memgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:3rem;text-align:center}
.memgrid span{background:var(--soft);border-radius:16px;padding:8px 0}
.die{width:130px;height:130px;margin:10px auto;border-radius:28px;background:#fff;color:#111;border:5px solid #111;font-family:var(--disp);font-weight:900;font-size:5rem;display:grid;place-items:center;box-shadow:0 6px 0 #111}
.die.spin{animation:spin .45s linear infinite}
.dtext{text-align:center;font-size:1.1rem}
.faces{font-size:.95rem}.faces summary{cursor:pointer;font-weight:700;padding:6px 0}.faces p{padding:2px 0}
.lowbox{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--sky) 14%,var(--card));border-left:6px solid var(--sky)}
.holdbox{text-align:center;padding:10px;border-radius:14px;background:var(--soft)}
.bignum{font-family:var(--disp);font-weight:900;font-size:7rem;line-height:1;text-align:center}

/* ---------- duels, radar ---------- */
.duelhead{align-items:center;text-align:center}
.vs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}.vs b{font-family:var(--disp);font-weight:900;font-size:1.4rem}
.duelhead h2{font-family:var(--disp);font-weight:900;font-size:2.2rem;text-transform:uppercase;line-height:1}
.duelpick{display:grid;gap:10px}
.dcard{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink)}
.dcard .de{grid-row:span 2;font-size:2.2rem}.dcard b{font-family:var(--disp);font-weight:800;font-size:1.5rem;text-transform:uppercase}.dcard small{color:var(--ink2);font-size:.9rem}
.dcard.coop{border-color:var(--safe)}
.radar{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.radar.near b{font-size:1.1rem}
.cand{gap:8px}

/* ---------- supplies ---------- */
.inv{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ie{font-size:2rem}.ib b{font-size:1.05rem}.ctx{color:var(--ink2);max-width:9ch;font-size:.78rem;text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--soft);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column}.stats b{font-family:var(--disp);font-weight:900;font-size:2rem;line-height:1}.stats span{font-size:.78rem;color:var(--ink2)}

/* ---------- ghost / host / end ---------- */
.elim{font-family:var(--disp);font-weight:800;font-size:1.7rem;line-height:1.1}
.ghostlist{display:grid;gap:6px}.gl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:46px;padding:6px 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:700}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hd{gap:8px}.hd.out{opacity:.65}.hd-i{display:flex;flex-direction:column;gap:4px}
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}.photo img{width:100%;max-width:240px;border-radius:12px;border:1px solid var(--line)}
.endpage{padding-top:0}
.fin{border-radius:0 0 28px 28px;margin:0 -16px;min-height:auto;padding-top:34px;align-items:flex-start;max-width:none}
.champ{display:flex;align-items:center;gap:14px;padding:10px 18px 10px 10px;border-radius:18px;background:hsl(var(--h) 58% 33%);align-self:stretch}
.champ .cn{font-family:var(--disp);font-weight:900;font-size:4.4rem;line-height:.9;padding:0 14px;background:rgba(0,0,0,.25);border-radius:12px}
.champ b{font-family:var(--disp);font-weight:900;font-size:2rem;line-height:1;text-transform:uppercase}
.champ.anim{animation:stamp .6s .4s cubic-bezier(.2,1.6,.4,1) both}
.statlist{display:grid;gap:4px;font-weight:700;font-size:1.08rem}
.lb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}.lb .pl{font-family:var(--disp);font-weight:900;font-size:1.6rem;min-width:2ch;text-align:center}
.lb.first{background:color-mix(in srgb,var(--signal) 16%,transparent);border-radius:12px;padding:8px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.overlay.dark{background:rgba(13,16,36,.97);color:#fff}
.overlay.dim{background:rgba(9,11,28,.62)}
.overlay.paused{background:rgba(13,16,36,.94);color:#fff;z-index:70;flex-direction:column}
.overlay.paused .hazard-bar{top:env(safe-area-inset-top,0px);height:16px}
.pausebox{text-align:center;display:flex;flex-direction:column;gap:12px}.pausebox h2{font-family:var(--disp);font-weight:900;font-size:5rem;line-height:1;color:var(--signal)}
.draw{text-align:center;display:flex;flex-direction:column;gap:14px}.draw .kick{color:#B9C0E4}.draw .bignum{color:var(--signal);font-size:10rem}
.bbox{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px;text-align:center}
.bicon{font-size:4rem}.btext{font-family:var(--disp);font-weight:800;font-size:2rem;line-height:1.08;white-space:normal}.banner .kick{color:var(--signal);font-size:1.05rem}
.modal{width:100%;max-width:420px;background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.modal h3{font-family:var(--disp);font-weight:900;font-size:1.9rem;line-height:1}
.hosted .page,.hosted .stage{padding-bottom:100px}
.fab{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;min-height:40px;padding:4px 14px;font-size:.9rem;border-radius:99px;background:var(--ink);color:var(--paper);border:0;font-weight:700;box-shadow:var(--shadow)}
.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:14px;font-weight:700;box-shadow:var(--shadow);animation:rise .3s both}

/* ---------- motion ---------- */
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes stamp{from{opacity:0;transform:scale(2.4) rotate(-14deg)}to{opacity:1;transform:rotate(-4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.champ.anim{animation-name:stamp}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media (min-width:600px){.page{padding-top:24px}}
</style>
</head>

<script>
/* ==========================================================================
   DISTRICT SURVIVAL — CONTENT
   Everything the game says or offers lives in this block. To add content,
   copy an existing entry in any list below, change the text, give it a new
   unique id. Nothing else needs to change.

   Effects ("ops") are small instructions the engine understands:
     {op:'gain', res:'water'|'random', n:1}      give supplies
     {op:'distribute', res:'random', n:1}         like gain, but The Resourceful gets +1
     {op:'lose', res:'random', n:1}               lose supplies to the Commons (to:'winner' in duels)
     {op:'life', n:1|-1}                          heal / hurt a life

/* ---------- DISTRICTS (identity, lore, motto) ---------- */

/* ---------- Arena geometry: 8 compass sectors x 3 rings (0 = the Hub) ---------- */
const SECTORS = ['north','northeast','east','southeast','south','southwest','west','northwest'];
const RING_R = [0, 0.45, 0.82];
const zoneXY = z => { if (!z || z.r === 0) return { x: 0, y: 0 }; const a = z.s * Math.PI / 4; return { x: Math.sin(a) * RING_R[z.r], y: -Math.cos(a) * RING_R[z.r] }; };
const zoneDist = (a, b) => { const p = zoneXY(a), q = zoneXY(b); return Math.hypot(p.x - q.x, p.y - q.y); };
const zoneName = z => z.r === 0 ? 'the Hub' : 'the ' + SECTORS[z.s] + ' side, ' + (z.r === 1 ? 'middle ring' : 'outer edge');
const bearingTxt = (a, b) => { const p = zoneXY(a), q = zoneXY(b), dx = q.x - p.x, dy = q.y - p.y; if (Math.hypot(dx, dy) < 0.05) return 'right around you'; const ang = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360; return SECTORS[Math.round(ang / 45) % 8]; };
const randZone = avoid => { for (let i = 0; i < 20; i++) { const z = { r: 1 + rnd(2), s: rnd(8) }; if (!avoid || zoneDist(z, avoid) > 0.2) return z; } return { r: 2, s: rnd(8) }; };
const zoneEq = (a, b) => a && b && a.r === b.r && (a.r === 0 || a.s === b.s);
function prox(a, b) {                                   // hub|duel|near|far
  const dd = zoneDist(a.zone, b.zone);
  if (a.zone.r === 0 || b.zone.r === 0) return dd < 0.1 ? 'hub' : (dd <= 0.85 ? 'near' : 'far');
  return dd <= 0.4 ? 'duel' : dd <= 0.85 ? 'near' : 'far';
}

  if (d < 40) return 'right around you (under about 250 feet)';
  const lo = night ? 0.4 : 0.7, hi = night ? 2 : 1.4;
  return 'approximately ' + r50(d * lo) + '–' + r50(d * hi) + ' feet away';
}

/* ---------- Partner picking (lobby). A pair is locked when BOTH players pick each other, or the host pairs them. ---------- */
function pairOf(s, p) { if (!p || !p.want) return null; const q = s.players[p.want]; return q && !q.left && !q.mock && q.want === p.id ? q : null; }
function requestPartner(s, pid, wantId) {
  const p = s.players[pid], q = s.players[wantId]; if (!p || !q || pid === wantId) return 'Not possible.';
  if (s.phase !== 'lobby') return 'Partners are locked in once the districts are drawn.';
  if (q.mock || p.mock) return 'Mock players cannot pick partners.';
  const qm = pairOf(s, q); if (qm && qm.id !== pid) return (q.nick || q.name) + ' already has a partner.';
  p.want = wantId; return '';
}
function clearPartner(s, pid) { const p = s.players[pid]; if (p) p.want = null; }
function hostPair(s, a, b) {

  [p, q].forEach(x => { const o = pairOf(s, x); if (o) { o.want = null; x.want = null; } }); p.want = b; q.want = a;
}

   Two adapters:

// objects (a nested object at one path overwrites that whole subtree instead
// of merging it), so every patch from diff() gets flattened before sending.

  if (typeof v.code !== 'string' || !v.code) return { ok: false, reason: 'missing code' };
  if (typeof v.phase !== 'string' || !v.phase) return { ok: false, reason: 'missing phase' };
  if (!isObj(v.settings)) return { ok: false, reason: 'missing settings' };

  // nested object that the renderer/engine expects before the state reaches UI.

  if (!isObj(v.players)) v.players = {};
  if (!isObj(v.districts)) v.districts = {};
  if (!isObj(v.alliances)) v.alliances = {};
  if (!isObj(v.allianceWin)) v.allianceWin = { open: false, until: 0 };
  if (!isObj(v.trades)) v.trades = {};
  if (!isObj(v.duels)) v.duels = {};
  if (!isObj(v.drops)) v.drops = {};
  if (!isObj(v.pool)) v.pool = {};
  if (!isObj(v.photos)) v.photos = {};
  if (!isObj(v.log)) v.log = {};
  if (!isObj(v.vote)) v.vote = {};
  if (!isObj(v.sched)) v.sched = {};
  if (!Array.isArray(v.order)) v.order = [];

  Object.values(v.players).forEach(p => {
    if (!p || typeof p !== 'object') return;
    if (!Array.isArray(p.want)) { /* no-op: want is normally a string */ }
    if (p.left == null) p.left = false;
    if (p.mock == null) p.mock = false;
    if (!p.avatar) p.avatar = avatars[0];

  });
  Object.values(v.districts).forEach(d => {
    if (!d || typeof d !== 'object') return;
    if (!Array.isArray(d.members)) d.members = [];
    if (!isObj(d.bonuses)) d.bonuses = isObj(d.supplies) ? d.supplies : {};

    if (!isObj(d.track)) d.track = {};
    if (!Array.isArray(d.start)) d.start = [];
    if (!isObj(d.stats)) d.stats = {};
    if (typeof d.stats.points !== 'number') d.stats.points = (+d.stats.challenges || 0);

/* ---------- Arena map (game-like, approximate zones only) ---------- */

  });
  if (d) g += put(d.zone, `<circle r="15" class="m-me-halo"/><path d="M0 -11 L9 8 L0 4 L-9 8 Z" class="m-me"/>`);
  if (view.event) g += `<text x="10" y="24" class="m-ev">${view.event}</text>`;

}

function friendlyFirebaseError(e, fallback) {
  const code = e && e.code || ''; const msg = e && e.message || '';
  if (code === 'auth/operation-not-allowed') return 'Firebase Anonymous Authentication is disabled. Enable Authentication → Sign-in method → Anonymous.';
  if (code === 'PERMISSION_DENIED' || code === 'database/permission-denied') return 'Firebase rejected this request. Check Anonymous Authentication and the Realtime Database rules.';
  if (code === 'FIREBASE_CONFIG_MISSING') return 'Firebase is not configured yet. Paste your Firebase Web App config into public/firebase-config.js.';
  if (code === 'FIREBASE_SDK_MISSING') return 'The Firebase SDK did not load. Check the deployed site connection.';
  if (code === 'FIREBASE_UNAVAILABLE') return 'Live multiplayer is not connected to Firebase. Check the Firebase configuration and your internet connection.';
  if (code === 'TIMEOUT') return 'Could not reach Firebase in time. Check your connection and try again.';
  if (msg && /permission_denied|permission denied/i.test(msg)) return 'Firebase rejected this request. Check your Realtime Database rules.';
  return fallback + (code ? ` (${code})` : '');
}

/* ---------- photos ---------- */
function handlePhoto(file) {
  if (!file) return; const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 240 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc)); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const data = c.toDataURL('image/jpeg', 0.6), id = uid('ph');
      Store.putPhoto(id, data).then(ok => { M((s, d) => { simpleDone(s, d, 'done', ok ? id : null); return ''; }); toast(ok ? '📸 Photo submitted!' : 'Upload failed, but it counts (honor system).'); });
    };
    img.onerror = () => toast('Could not read that photo.'); img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
